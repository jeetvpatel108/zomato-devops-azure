trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  sonarConnection: 'SonarQube'
  azureConnection: 'azure-connection'
  acrName: 'zomatoacr1410'
  imageRepository: 'zomato'
  tag: '$(Build.BuildId)'
  fullImage: '$(acrName).azurecr.io/$(imageRepository)'

steps:
  - checkout: self

  # ---------- 1. Code quality: SonarQube ----------
  - task: SonarQubePrepare@7
    displayName: 'Prepare SonarQube'
    inputs:
      SonarQube: '$(sonarConnection)'
      scannerMode: 'cli'
      configMode: 'manual'
      cliProjectKey: 'zomato-app'
      cliProjectName: 'zomato-app'
      cliSources: '.'
      extraProperties: |
        sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**

  # ---------- 2. Build & test ----------
  - task: NodeTool@0
    displayName: 'Install Node.js 18'
    inputs:
      versionSpec: '18.x'

  - script: npm install --legacy-peer-deps
    displayName: 'Install Dependencies'

  - script: CI=true npm test -- --watchAll=false --passWithNoTests || echo "No tests found"
    displayName: 'Run Unit Tests'

  - task: SonarQubeAnalyze@7
    displayName: 'Run SonarQube Analysis'

  - task: SonarQubePublish@7
    displayName: 'Publish SonarQube Results'
    inputs:
      pollingTimeoutSec: '300'

  # ---------- 3. Build & Push with ACR (no Docker Hub auth needed) ----------
  - task: AzureCLI@2
    displayName: 'Build and Push Image using ACR Tasks'
    inputs:
      azureSubscription: '$(azureConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az acr build \
          --registry $(acrName) \
          --image $(imageRepository):$(tag) \
          --image $(imageRepository):latest \
          --file Dockerfile \
          .

  # ---------- 4. Security scan: Trivy ----------
  - script: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      trivy --version
    displayName: 'Install Trivy'

  - task: AzureCLI@2
    displayName: 'Trivy Vulnerability Scan'
    inputs:
      azureSubscription: '$(azureConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        TOKEN=$(az acr login --name $(acrName) --expose-token --output tsv --query accessToken)
        docker login $(acrName).azurecr.io -u 00000000-0000-0000-0000-000000000000 -p $TOKEN
        echo "Scanning $(fullImage):$(tag)"
        trivy image --severity HIGH,CRITICAL --exit-code 0 --format table $(fullImage):$(tag)